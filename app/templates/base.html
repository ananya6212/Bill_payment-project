<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        QuickBill
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

    <header class="topbar">

        <div class="brand">
            QuickBill
        </div>

        <nav>

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/products">
                Inventory
            </a>

            <a href="/invoices/new">
                New Invoice
            </a>

            <a href="/invoices">
                Invoices
            </a>

            <a href="/settings">
                Settings
            </a>

        </nav>

    </header>


    <main class="main-container">

        {% block content %}
        {% endblock %}

    </main>


    <script
        src="{{ url_for('static', path='js/app.js') }}"
    ></script>

</body>

</html>
