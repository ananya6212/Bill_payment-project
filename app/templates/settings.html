{% extends "base.html" %}

{% block title %}
Settings - QuickBill
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Settings</h1>
        <p>Manage your store information</p>
    </div>
</div>

<div class="card">


<form method="post" action="/settings">

    <div class="form-group">

        <label for="store_name">
            Store Name
        </label>

        <input
            type="text"
            id="store_name"
            name="store_name"
            value="{{ store_name }}"
            required
        >

    </div>


    <div class="form-group">

        <label for="store_phone">
            Phone
        </label>

        <input
            type="text"
            id="store_phone"
            name="store_phone"
            value="{{ store_phone }}"
        >

    </div>


    <div class="form-group">

        <label for="store_address">
            Address
        </label>

        <textarea
            id="store_address"
            name="store_address"
            rows="4"
        >{{ store_address }}</textarea>

    </div>


    <button
        type="submit"
        class="btn btn-primary"
    >
        Save Settings
    </button>

</form>


</div>

<!-- Success Popup -->

{% if request.query_params.get("saved") == "1" %}

<script>

    window.addEventListener(
        "DOMContentLoaded",
        function () {

            alert(
                "Information added successfully!"
            );

        }
    );

</script>

{% endif %}

{% endblock %}
